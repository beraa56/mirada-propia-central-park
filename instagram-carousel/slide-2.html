<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="carousel.css">

<body>
<div class="slide">

  <div class="slide-scrim-full"></div>
  <img class="slide-brand" src="../images/logo-mark-white.png" alt="">
  <div class="slide-content">
    <div class="slide-kicker">Qué es</div>
    <div class="slide-rule"></div>

    <div class="slide-chips">
      <div class="slide-chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        3 horas
      </div>
      <div class="slide-chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 22s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
        Central Park, NY
      </div>
      <div class="slide-chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="16" rx="1.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        3 oct 2026
      </div>
      <div class="slide-chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="9" r="3"/><circle cx="17" cy="10" r="2.4"/><path d="M2 20c0-3.3 2.7-6 6-6s6 2.7 6 6M14.5 14.3c2.6.2 4.5 2.3 4.5 5"/></svg>
        Personas reales, no modelos
      </div>
    </div>
  </div>
</div>
</body>
</html>
