<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="carousel.css">
</head>
<body>
<div class="slide" style="background:var(--cream);">
  <div class="slide-light" style="padding-top:110px;">
    <div class="kicker">Tu transformación</div>
    <h2>De disparar sin plan<br>a <em>dirigir con intención</em></h2>
    <div class="transform-pairs">
      <div class="transform-pair">
        <div class="transform-before">Disparas y esperas que salga bien</div>
        <div class="transform-arrow">→</div>
        <div class="transform-after">Diriges con intención, no al azar</div>
      </div>
      <div class="transform-pair">
        <div class="transform-before">Te bloqueas con luz difícil</div>
        <div class="transform-arrow">→</div>
        <div class="transform-after">Lees la luz y la usas a tu favor</div>
      </div>
      <div class="transform-pair">
        <div class="transform-before">Portafolio con sesiones "seguras"</div>
        <div class="transform-arrow">→</div>
        <div class="transform-after">Portafolio con imágenes Fine Art reales</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
